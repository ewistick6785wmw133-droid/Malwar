<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Client</title>
    <style>
        /* Базовые настройки экрана без прокрутки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Полноэкранный GIF фон */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://simple-animation.ru');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Затемнение поверх гифки */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.75);
            z-index: -1;
        }

        /* Верхняя шапка сайта */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .nav-container {
            position: relative;
            padding-bottom: 8px;
        }
        nav {
            display: flex;
            gap: 32px;
        }
        nav a {
            color: #ffffff !important;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        nav a:hover {
            opacity: 0.7;
        }
        .active-link {
            color: #3b82f6 !important;
        }
        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 120px;
            border-bottom: 2px solid #3b82f6;
        }
        .search-box input {
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #bfdbfe;
            text-transform: uppercase;
            outline: none;
            width: 200px;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #3b82f6;
        }

        /* Главный контент СТРОГО ПО СЕРЕДИНЕ СЛЕВА */
        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Центрирование по вертикали */
            align-items: flex-start; /* Прижать к левому краю */
            flex-grow: 1;
            z-index: 10;
        }

        /* Название синее и чуть прозрачное */
        .main-logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #2563eb;
            opacity: 0.75;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        /* Описание темно-серое, чуть прозрачное, но читаемое */
        .main-quote {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 500;
            color: #64748b;
            opacity: 0.85;
            max-width: 550px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px #000000;
        }

        /* Синие кнопки */
        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 16px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .btn-filled {
            background: rgba(30, 58, 138, 0.9);
            color: #bfdbfe;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.8);
        }
        .btn-filled:hover {
            background: #1e3a8a;
        }
        .btn-border {
            background: transparent;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.6);
        }
        .btn-border:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        /* Подвал */
        footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 32px 40px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <!-- Компоненты заднего фона -->
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-container">
            <nav>
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#" class="active-link">Pricing</a>
                <a href="#">Help</a>
                <a href="#">Blog</a>
            </nav>
            <div class="bottom-line"></div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search">
        </div>
    </header>

    <!-- Главный блок (по центру слева) -->
    <main>
        <h1 class="main-logo">MALWARE</h1>
        <p class="main-quote">
            Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.
        </p>
        <div class="btn-container">
            <a href="#" class="btn btn-filled">Get Started</a>
            <a href="#" class="btn btn-border">View More</a>
        </div>
    </main>

    <!-- Подвал сайта -->
    <footer>
        &copy; 2026 Malware Project. All rights reserved.
    </footer>

</body>
</html>
