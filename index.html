<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Client</title>
    <!-- Топовый шрифт Montserrat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: #0b0b12;
        }

        /* Прямая ссылка на файл внутри твоего гитхаба */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.gif?v=2');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Затемнение поверх гифки */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 14, 0.75);
            z-index: -1;
        }

        /* Шапка сайта */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 0 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
        }
        .nav-container {
            position: relative;
            padding-bottom: 8px;
        }
        nav {
            display: flex;
            gap: 40px;
        }
        nav a {
            color: #ffffff !important;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        nav a:hover {
            opacity: 0.7;
        }
        /* Синий цвет для активной ссылки */
        .active-link {
            color: #3b82f6 !important;
        }
        /* Тонкая синяя линия, которая будет двигаться под кнопками */
        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            border-bottom: 2px solid #3b82f6;
            transition: all 0.3s ease;
        }

        /* Главный контент по середине слева */
        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: flex-start; 
            flex-grow: 1;
            z-index: 10;
        }

        /* Название / Заголовок */
        .main-logo {
            font-size: 72px;
            font-weight: 900; 
            letter-spacing: 6px;
            color: #2563eb;
            opacity: 0.75;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
            transition: all 0.2s ease;
        }

        /* Описание */
        .main-quote {
            margin-top: 24px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b; 
            opacity: 0.85;
            max-width: 550px;
            line-height: 1.7;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
        }

        /* Кнопки */
        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 16px;
            transition: opacity 0.2s ease;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .btn-filled {
            background: #1e3a8a;
            color: #ffffff;
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-filled:hover {
            background: #2563eb;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }
        .btn-border {
            background: transparent;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.6);
        }
        .btn-border:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 32px 40px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-container">
            <nav>
                <a id="nav-home" class="active-link" onclick="showPage('home')">Home</a>
                <a id="nav-install" onclick="showPage('install')">Install</a>
                <a id="nav-discord" onclick="showPage('discord')">Discord</a>
                <a id="nav-help" onclick="showPage('help')">Help</a>
            </nav>
            <div id="blue-line" class="bottom-line"></div>
        </div>
    </header>

    <!-- Главный блок -->
    <main>
        <!-- Сюда скрипт будет подставлять нужный текст -->
        <h1 id="page-title" class="main-logo">MALWARE</h1>
        <p id="page-text" class="main-quote">
            Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.
        </p>
        <div id="page-buttons" class="btn-container">
            <a href="#" class="btn btn-filled">Get Started</a>
            <a href="#" class="btn btn-border">View More</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Malware Project. All rights reserved.
    </footer>

    <!-- Умный скрипт переключения контента -->
    <script>
        function showPage(pageName) {
            // Убираем активный класс со всех ссылок меню
            document.getElementById('nav-home').classList.remove('active-link');
            document.getElementById('nav-install').classList.remove('active-link');
            document.getElementById('nav-discord').classList.remove('active-link');
            document.getElementById('nav-help').classList.remove('active-link');

            // Элементы контента
            const title = document.getElementById('page-title');
            const text = document.getElementById('page-text');
            const buttons = document.getElementById('page-buttons');
            const line = document.getElementById('blue-line');

            // Логика переключения
            if (pageName === 'home') {
                document.getElementById('nav-home').classList.add('active-link');
                line.style.left = '0px';
                line.style.width = '60px';
                
                title.innerText = "MALWARE";
                text.innerText = "Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.";
                buttons.style.opacity = "1";
                buttons.style.pointerEvents = "auto";
            } 
            else if (pageName === 'help') {
                document.getElementById('nav-help').classList.add('active-link');
                // Сдвигаем синюю полоску под слово HELP
                line.style.left = '290px'; 
                line.style.width = '50px';

                title.innerText = "HOW TO PLAY";
                text.innerText = "Приветствуем на сайте чита Malwar! Дальше здесь будет рассказываться, как им пользоваться, как настраивать функции под легитную или жесткую игру и как проходить любые проверки администрации.";
                // Прячем кнопки, так как на странице гайда они не нужны
                buttons.style.opacity = "0";
                buttons.style.pointerEvents = "none";
            }
        }
    </script>

</body>
</html>
