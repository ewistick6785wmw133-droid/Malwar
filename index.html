<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Client</title>
    <!-- Шрифт Montserrat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: #0b0b12;
        }
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.gif?v=2');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 14, 0.75);
            z-index: -1;
        }
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 0 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
        }
        .nav-container {
            position: relative;
            padding-bottom: 8px;
        }
        nav {
            display: flex;
            gap: 40px;
        }
        nav a {
            color: #ffffff !important;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        nav a:hover {
            opacity: 0.7;
        }
        .active-link {
            color: #3b82f6 !important;
        }
        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            border-bottom: 2px solid #3b82f6;
            transition: all 0.3s ease;
        }
        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: flex-start; 
            flex-grow: 1;
            z-index: 10;
        }
        .main-logo {
            font-size: 72px;
            font-weight: 900; 
            letter-spacing: 6px;
            color: #2563eb;
            opacity: 0.75;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
            transition: all 0.2s ease;
        }
        .main-quote {
            margin-top: 24px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b; 
            opacity: 0.85;
            max-width: 550px;
            line-height: 1.7;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
        }
        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .btn-blue-filled {
            background: #1e3a8a;
            color: #ffffff;
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-blue-filled:hover {
            background: #2563eb;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }
        .btn-blue-border {
            background: transparent;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.6);
        }
        .btn-blue-border:hover {
            background: rgba(59, 130, 246, 0.15);
        }
        .btn-green {
            background: #15803d !important;
            color: #ffffff !important;
            border: 1px solid rgba(34, 197, 94, 0.5) !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-green:hover {
            background: #22c55e !important;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
        }
        footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 32px 40px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <header>
        <div class="nav-container">
            <nav>
                <a id="nav-home" class="active-link" onclick="showPage('home')">Home</a>
                <a id="nav-install" onclick="showPage('install')">Install</a>
                <a id="nav-discord" onclick="showPage('discord')">Discord</a>
                <a id="nav-help" onclick="showPage('help')">Help</a>
            </nav>
            <div id="blue-line" class="bottom-line"></div>
        </div>
    </header>

    <main>
        <h1 id="page-title" class="main-logo">MALWARE</h1>
        <p id="page-text" class="main-quote">
            Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.
        </p>
        <div id="page-buttons" class="btn-container">
            <a id="btn-left" href="#" class="btn btn-blue-filled">Get Started</a>
            <a id="btn-right" href="#" class="btn btn-blue-border">View More</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Malware Project. All rights reserved.
    </footer>

    <!-- СЮДА СЕЙЧАС ДВСТАВИМ ВТОРУЮ ЧАСТЬ -->
    <script>
        function showPage(pageName) {
            document.getElementById('nav-home').classList.remove('active-link');
            document.getElementById('nav-install').classList.remove('active-link');
            document.getElementById('nav-discord').classList.remove('active-link');
            document.getElementById('nav-help').classList.remove('active-link');

            const title = document.getElementById('page-title');
            const text = document.getElementById('page-text');
            const buttons = document.getElementById('page-buttons');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const line = document.getElementById('blue-line');

            buttons.style.opacity = "1";
            buttons.style.pointerEvents = "auto";
            btnLeft.className = "btn";
            btnRight.className = "btn";

            if (pageName === 'home') {
                document.getElementById('nav-home').classList.add('active-link');
                line.style.left = '0px';
                line.style.width = '60px';
                title.innerText = "MALWARE";
                text.innerText = "Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.";
                btnLeft.classList.add('btn-blue-filled');
                btnLeft.innerText = "Get Started";
                btnRight.classList.add('btn-blue-border');
                btnRight.innerText = "View More";
                btnLeft.onclick = null;
            } 
            else if (pageName === 'install') {
                document.getElementById('nav-install').classList.add('active-link');
                line.style.left = '100px';
                line.style.width = '75px';
                title.innerText = "INSTALLATION";
                text.innerText = "Скачайте актуальную версию Malware Client. Перед запуском лаунчера обязательно ознакомьтесь с инструкцией по установке и настройке обхода проверок.";
                btnLeft.classList.add('btn-blue-filled');
                btnLeft.innerText = "ИНСТРУКЦИЯ";
                btnLeft.onclick = function() { showPage('help'); };
                btnRight.classList.add('btn-green');
                btnRight.innerText = "INSTALL";
                btnRight.onclick = null;
            }
            else if (pageName === 'help') {
                document.getElementById('nav-help').classList.add('active-link');
                line.style.left = '315px'; 
                line.style.width = '50px';
                title.innerText = "HOW TO PLAY";
                text.innerText = "Приветствуем на сайте чита Malwar! Дальше здесь будет рассказываться, как им пользоваться, как настраивать функции под легитную или жесткую игру и как проходить любые проверки администрации.";
                buttons.style.opacity = "0";
                buttons.style.pointerEvents = "none";
            }
            else if (pageName === 'discord') {
                document.getElementById('nav-discord').classList.add('active-link');
                line.style.left = '215px';
                line.style.width = '75px';
                title.innerText = "DISCORD SERVER";
                text.innerText = "Присоединяйся к нашему официальному сообществу! Здесь ты сможешь найти актуальные кастомные конфиги, пообщаться с другими игроками и первыми узнавать о выходе новых обновлений.";
                btnLeft.classList.add('btn-blue-filled');
                btnLeft.innerText = "ВОЙТИ В ДИСКОРД";
                // Сюда можно вписать ссылку на твой сервер вместо '#'
                btnLeft.setAttribute('href', 'https://discord.gg'); 
                btnLeft.setAttribute('target', '_blank');
                buttons.style.opacity = "1";
                buttons.style.pointerEvents = "auto";
                btnRight.style.display = "none"; 
            }
        }
    </script>
</body>
</html>
