<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Client</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Полноэкранный фон без потери качества */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://simple-animation.ru');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        /* Тёмный полупрозрачный слой */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.7);
            z-index: -1;
        }
    </style>
</head>
<!-- h-screen и overflow-hidden полностью запрещают прокрутку сайта -->
<body class="h-screen overflow-hidden flex flex-col justify-between text-white font-sans antialiased relative">

    <!-- Задний фон (Гифка + затемнение) -->
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <!-- Шапка сайта -->
    <header class="w-full max-w-7xl mx-auto px-8 pt-8 flex justify-between items-center z-10 gap-4">
        <div class="relative pb-2">
            <nav class="flex space-x-8 text-xs font-bold tracking-widest uppercase text-blue-400">
                <a href="#" class="hover:text-blue-300 transition duration-200">Home</a>
                <a href="#" class="hover:text-blue-300 transition duration-200">Product</a>
                <a href="#" class="hover:text-blue-300 transition duration-200">Pricing</a>
                <a href="#" class="hover:text-blue-300 transition duration-200">Help</a>
                <a href="#" class="hover:text-blue-300 transition duration-200">Blog</a>
            </nav>
            <!-- Тонкая синяя линия под активным разделом -->
            <div class="absolute bottom-0 left-0 w-32 border-b border-blue-500"></div>
        </div>

        <!-- Поисковая строка БЕЗ багнутой иконки лупы -->
        <div class="relative hidden sm:block w-48 md:w-64">
            <input type="text" placeholder="SEARCH" class="w-full bg-transparent border border-blue-500/40 rounded px-4 py-1.5 text-xs font-bold tracking-wider uppercase placeholder-blue-400/40 focus:outline-none focus:border-blue-400 transition text-blue-200">
        </div>
    </header>

    <!-- Главный контент слева -->
    <main class="w-full max-w-7xl mx-auto px-8 py-4 flex flex-col justify-center items-start z-10 flex-grow">
        
        <!-- Название: в синем тоне, видимость 80% чтобы не сливалось -->
        <h1 class="text-5xl md:text-7xl font-black tracking-wider uppercase text-blue-500 opacity-80 leading-none filter drop-shadow-[0_0_20px_rgba(59,130,246,0.4)]">
            MALWARE
        </h1>
        
        <!-- Цитата: темно-серая, видимость 80% (теперь она читается лучше) -->
        <p class="mt-4 text-slate-400 opacity-80 text-sm md:text-base font-medium max-w-xl leading-relaxed">
            Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.
        </p>

        <!-- Кнопки в синем стиле -->
        <div class="mt-10 flex flex-wrap gap-4">
            <!-- Залитая синяя кнопка -->
            <a href="#" class="px-8 py-3 bg-blue-950/90 hover:bg-blue-900 text-blue-200 text-xs font-bold tracking-widest uppercase rounded-full border border-blue-500/40 shadow-lg shadow-blue-950/80 transition duration-200">
                Get Started
            </a>
            <!-- Прозрачная синяя кнопка -->
            <a href="#" class="px-8 py-3 bg-transparent hover:bg-blue-500/20 text-blue-400 text-xs font-bold tracking-widest uppercase rounded-full border border-blue-500/60 transition duration-200">
                View More
            </a>
        </div>
    </main>

    <!-- Декоративные элементы справа (в синем цвете) -->
    <div class="absolute top-8 right-8 hidden lg:flex flex-col gap-1 opacity-20">
        <div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div><div class="w-6 h-0.5 bg-blue-400"></div>
    </div>
    
    <div class="absolute bottom-12 right-12 hidden lg:grid grid-cols-2 gap-2 opacity-20">
        <div class="w-2 h-2 bg-blue-400 rounded-full"></div><div class="w-2 h-2 bg-blue-400 rounded-full"></div>
        <div class="w-2 h-2 bg-blue-400 rounded-full"></div><div class="w-2 h-2 bg-blue-400 rounded-full"></div>
    </div>

    <!-- Подвал сайта -->
    <footer class="w-full max-w-7xl mx-auto px-8 py-6 z-10 text-slate-600 text-xs tracking-widest uppercase border-t border-white/5">
        &copy; 2026 Malware Project. All rights reserved.
    </footer>

</body>
</html>
