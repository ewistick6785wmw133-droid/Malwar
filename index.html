<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Client</title>
    <!-- Топовый шрифт Montserrat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Базовые настройки экрана */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 100% рабочая гифка с серверов Discord (не блокируется сайтами) */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://discordapp.com&');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Затемнение поверх гифки для идеальной читаемости */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 14, 0.75);
            z-index: -1;
        }

        /* Верхняя шапка сайта */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 0 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
        }
        .nav-container {
            position: relative;
            padding-bottom: 8px;
        }
        nav {
            display: flex;
            gap: 40px;
        }
        nav a {
            color: #ffffff !important;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        nav a:hover {
            opacity: 0.7;
        }
        .active-link {
            color: #3b82f6 !important;
        }
        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            border-bottom: 2px solid #3b82f6;
        }

        /* Главный контент СТРОГО ПО СЕРЕДИНЕ СЛЕВА */
        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: flex-start; 
            flex-grow: 1;
            z-index: 10;
        }

        /* Название синее, жирное */
        .main-logo {
            font-size: 72px;
            font-weight: 900; 
            letter-spacing: 6px;
            color: #2563eb;
            opacity: 0.75;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
        }

        /* Описание под названием */
        .main-quote {
            margin-top: 24px;
            font-size: 15px;
            font-weight: 500;
            color: #94a3b8; 
            max-width: 550px;
            line-height: 1.7;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Синие кнопки */
        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .btn-filled {
            background: #1e3a8a;
            color: #ffffff;
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-filled:hover {
            background: #2563eb;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }
        .btn-border {
            background: transparent;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.6);
        }
        .btn-border:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        /* Подвал */
        footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 32px 40px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <!-- Задний фон -->
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-container">
            <nav>
                <a href="#" class="active-link">Home</a>
                <a href="#">Install</a>
                <a href="#">Discord</a>
                <a href="#">Help</a>
            </nav>
            <div class="bottom-line"></div>
        </div>
    </header>

    <!-- Главный блок -->
    <main>
        <h1 class="main-logo">MALWARE</h1>
        <p class="main-quote">
            Устал от постоянных проверок, банов и лагов? Malwar — это приватный софт нового поколения, созданный специально для ReallyWorld.
        </p>
        <div class="btn-container">
            <a href="#" class="btn btn-filled">Get Started</a>
            <a href="#" class="btn btn-border">View More</a>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        &copy; 2026 Malware Project. All rights reserved.
    </footer>

</body>
</html>
